name: Feature or benchmark proposal
description: Propose a focused improvement or reproducible test case
title: "[Proposal] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user value
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain routing, scope, fallback, and acceptance checks.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This proposal does not add exploit instructions, credential theft, destructive automation, or unauthorized access.
          required: true
