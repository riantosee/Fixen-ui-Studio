name: Bug report
description: Report a reproducible problem with the skill or documentation
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, private data, or exploit details. Use SECURITY.md for vulnerabilities."
  - type: input
    id: version
    attributes:
      label: Version
      description: Skill/repository version or commit.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request and expected result
      description: Include the smallest safe, synthetic request that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Tools and checks
      description: Browser, renderer, viewport, commands, and limitations.
    validations:
      required: true
