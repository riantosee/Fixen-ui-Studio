name: Validate skill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate skill package
        run: python scripts/validate.py
      - name: Validator regression tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
